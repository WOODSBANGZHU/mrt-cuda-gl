name: Linux CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Build CUDA/OpenGL bridge
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build libmrt_cuda_gl.so
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            nvidia/cuda:12.4.1-devel-ubuntu22.04 \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential cmake pkg-config libavutil-dev libgl-dev \
                openjdk-17-jdk
              cmake -S . -B build/cuda-gl \
                -DCMAKE_BUILD_TYPE=Release
              cmake --build build/cuda-gl --config Release --parallel
            '
      - name: Upload native bridge
        uses: actions/upload-artifact@v4
        with:
          name: mrt_cuda_gl-linux-x86_64
          path: build/cuda-gl/libmrt_cuda_gl.so
          if-no-files-found: error
